name: bench

on:
  push:
    branches: [main]
    paths: ["bench/**", ".github/workflows/bench.yml"]
  pull_request:
    branches: [main]
    paths: ["bench/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

env:
  IMAGE: ivukotic/ixcache-bench

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build into the local daemon first so the image can be smoke-tested.
      - uses: docker/build-push-action@v7
        with:
          context: bench
          load: true
          tags: ixbench:test
          cache-from: type=gha,scope=bench
          cache-to: type=gha,scope=bench,mode=max

      - name: Smoke test
        run: |
          docker run --rm ixbench:test --help
          docker run --rm --entrypoint xrdcp ixbench:test --version
          printf 'IXBENCH {"type":"config","mode":"warm","run":"t","pod":0}\nIXBENCH {"type":"xfer","run":"t","pod":0,"endpoint":"e:1094","path":"/p","origin":"o:1094","size":1,"bytes":1,"rc":0,"start":0,"end":1,"ttfb":0.1}\n' > /tmp/t.log
          docker run --rm -v /tmp/t.log:/t.log:ro ixbench:test report /t.log

      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: bench
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bench
