# Single-replica ixcache server on the host network of the xcache=slate01 node.
# Clients connect to root://<node>:1092//root://origin//path.
#
# Prerequisites:
#   - Service certificate and key in the xcache-cert-secret Secret (keys
#     usercert, userkey). The x509 sidecar uses them to keep a fresh proxy at
#     /etc/proxy/x509up in a shared in-memory volume; the server reloads the
#     file when it changes. It also refreshes the image's IGTF CA certificates
#     and CRLs and copies /etc/grid-security into a shared volume that ixcache
#     mounts at /etc/grid-security.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ixcache
  namespace: ixcache
  labels:
    app.kubernetes.io/name: ixcache
spec:
  replicas: 1
  # The data volume is ReadWriteOnce on one node: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ixcache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ixcache
    spec:
      securityContext:
        runAsUser: 10940
        runAsGroup: 10940
        runAsNonRoot: true
        fsGroup: 10940
        fsGroupChangePolicy: OnRootMismatch
      hostNetwork: true
      nodeSelector:
        xcache: slate01
      tolerations:
        - effect: PreferNoSchedule
          key: xcache
          operator: Equal
          value: "true"
      restartPolicy: Always
      # Allow in-flight transfers to finish and metadata to be flushed.
      terminationGracePeriodSeconds: 120
      # Native sidecar (Kubernetes 1.29+): keeps the proxy fresh for the pod's
      # lifetime; ixcache starts only after the first proxy has been written.
      initContainers:
        - name: x509
          restartPolicy: Always
          # The updater needs root: fetch-crl writes the image's CA directory, and
          # the proxy is chowned to xrootd (10940, the pod's user) for ixcache.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          command:
            - /usr/local/sbin/run_x509_updater.sh
          image: harbor.tempest.uchicago.edu/docker.io/ivukotic/atlas-xcache-heartbeats:2026.10.18
          imagePullPolicy: Always
          startupProbe:
            exec:
              command:
                [
                  sh,
                  -c,
                  "test -d /etc/CA/certificates && test -s /etc/proxy/x509up",
                ]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            limits:
              memory: 512M
              cpu: 500m
            requests:
              cpu: 100m
              memory: 512M
              ephemeral-storage: 600M
          volumeMounts:
            - mountPath: /etc/proxy/
              name: x509-data
            - mountPath: /etc/grid-certs/
              name: x509-certs-volume
              readOnly: true
            - mountPath: /etc/CA
              name: grid-security

      containers:
        - name: ixcache
          image: ivukotic/ixcache:latest
          imagePullPolicy: Always
          ports:
            - name: xrootd
              containerPort: 1092
              protocol: TCP
          env:
            - name: IXCACHE_CACHE_DIR
              value: /data
            - name: X509_USER_PROXY
              value: /etc/proxy/x509up
            - name: X509_CERT_DIR
              value: /etc/grid-security/certificates
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: "16"
              memory: 32Gi
            limits:
              memory: 32Gi
              cpu: "32"
          # Replace with HTTP health/readiness endpoints once they exist (Phase 3).
          startupProbe:
            tcpSocket:
              port: xrootd
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: xrootd
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: xrootd
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /data
              name: xcache-data-0
            - mountPath: /data2
              name: xcache-data-1
            - name: x509-data
              mountPath: /etc/proxy
              readOnly: true
            - name: grid-security
              mountPath: /etc/grid-security
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        # CA certificates and CRLs, filled and refreshed by the x509 sidecar.
        - name: grid-security
          emptyDir:
            sizeLimit: 200Mi
        - name: tmp
          emptyDir: {}

        - name: x509-data
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: x509-certs-volume
          secret:
            defaultMode: 420
            items:
              - key: userkey
                mode: 256
                path: userkey.pem
              - key: usercert
                path: usercert.pem
            secretName: xcache-cert-secret
        - hostPath:
            path: /xcache/23
          name: xcache-data-0
        - hostPath:
            path: /xcache/24
          name: xcache-data-1
