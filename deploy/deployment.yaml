# Single-replica ixcache server on the host network of the xcache=slate01 node.
# Clients connect to root://<node>:1094//root://origin//path.
#
# Prerequisites:
#   - Service certificate and key in the xcache-cert-secret Secret (keys
#     usercert, userkey). The x509 sidecar uses them to keep a fresh proxy at
#     /etc/proxy/x509up in a shared in-memory volume; the server reloads the
#     file when it changes. It also refreshes the image's IGTF CA certificates
#     and CRLs and copies /etc/grid-security into a shared volume that ixcache
#     mounts at /etc/grid-security.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ixcache
  namespace: ixcache
  labels:
    app.kubernetes.io/name: ixcache
spec:
  replicas: 1
  # The data volume is ReadWriteOnce on one node: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ixcache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ixcache
    spec:
      securityContext:
        runAsUser: 10940
        runAsGroup: 10940
        runAsNonRoot: true
        # No fsGroup: it makes secret files group-readable (0440), and
        # voms-proxy-init in the x509 sidecar rejects a key that is not 0400/0600.
      hostNetwork: true
      nodeSelector:
        xcache: slate01
      tolerations:
        - effect: PreferNoSchedule
          key: xcache
          operator: Equal
          value: "true"
      restartPolicy: Always
      # Allow in-flight transfers to finish and metadata to be flushed.
      terminationGracePeriodSeconds: 120
      # Native sidecar (Kubernetes 1.29+): keeps the proxy fresh for the pod's
      # lifetime; ixcache starts only after the first proxy has been written.
      initContainers:
        - name: x509
          restartPolicy: Always
          # The updater needs root: fetch-crl writes the image's CA directory, and
          # the proxy is chowned to xrootd (10940, the pod's user) for ixcache.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          command:
            - /usr/local/sbin/run_x509_updater.sh
          image: harbor.tempest.uchicago.edu/docker.io/ivukotic/atlas-xcache-heartbeats:2026.10.18
          imagePullPolicy: Always
          startupProbe:
            exec:
              command:
                [
                  sh,
                  -c,
                  "test -d /etc/CA/certificates && test -s /etc/proxy/x509up",
                ]
            # The proxy appears only after fetch-crl, which first sleeps up to
            # 6 minutes (-r 360) and then takes a few minutes to download: allow 15.
            periodSeconds: 5
            failureThreshold: 180
          resources:
            limits:
              memory: 512M
              cpu: 500m
            requests:
              cpu: 100m
              memory: 512M
              ephemeral-storage: 600M
          volumeMounts:
            - mountPath: /etc/proxy/
              name: x509-data
            - mountPath: /etc/grid-certs/
              name: x509-certs-volume
              readOnly: true
            - mountPath: /etc/CA
              name: grid-security

      containers:
        - name: ixcache
          image: ivukotic/ixcache:latest
          imagePullPolicy: Always
          ports:
            - name: xrootd
              containerPort: 1094
              protocol: TCP
            - name: health
              containerPort: 8092
              protocol: TCP
          env:
            # The standard XRootD port (ixcache's default is 1092).
            - name: IXCACHE_PORT
              value: "1094"
            - name: IXCACHE_HEALTH_PORT
              value: "8092"
            # VPS heartbeat, sent (at most once a minute) when the readiness probe
            # passes. size is the cache disks' total capacity in KB.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: IXCACHE_HEARTBEAT_URL
              value: https://vps.cern.ch/liveness
            - name: IXCACHE_SITE
              value: MWT2
            - name: IXCACHE_INSTANCE
              value: xcache-uc-1
            - name: IXCACHE_ADDRESS
              value: $(HOST_IP):1094
            # One directory per disk (comma-separated), each a subdirectory so
            # nothing else on the disk is counted or touched. Each directory's size
            # defaults to its file system; IXCACHE_CACHE_SIZE overrides it per
            # directory. New files are spread by free space.
            - name: IXCACHE_CACHE_DIR
              value: "/data-1/ixcache,/data-2/ixcache,/data-3/ixcache,/data-4/ixcache,/data-5/ixcache,/data-6/ixcache,/data-7/ixcache,/data-8/ixcache,/data-9/ixcache,/data-10/ixcache,/data-11/ixcache,/data-12/ixcache,/data-13/ixcache,/data-14/ixcache,/data-15/ixcache,/data-16/ixcache,/data-17/ixcache,/data-19/ixcache,/data-20/ixcache,/data-21/ixcache,/data-22/ixcache,/data-23/ixcache,/data-24/ixcache"
            - name: X509_USER_PROXY
              value: /etc/proxy/x509up
            - name: X509_CERT_DIR
              value: /etc/grid-security/certificates
            # No client authentication, like the native XCaches. For "gsi", also
            # mount a host certificate for this node and set IXCACHE_HOSTCERT and
            # IXCACHE_HOSTKEY to its files (the robot certificate will not do:
            # clients require the server certificate to match the host name).
            - name: IXCACHE_AUTH
              value: none
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: "16"
              memory: 32Gi
            limits:
              memory: 32Gi
              cpu: "32"
          # /healthz: XRootD port open and network threads responsive.
          # /readyz: also a writable cache disk, a valid service proxy and CA
          # certificates; passing it sends the VPS heartbeat when one is due.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /data-1
              name: xcache-data-1
            - mountPath: /data-2
              name: xcache-data-2
            - mountPath: /data-3
              name: xcache-data-3
            - mountPath: /data-4
              name: xcache-data-4
            - mountPath: /data-5
              name: xcache-data-5
            - mountPath: /data-6
              name: xcache-data-6
            - mountPath: /data-7
              name: xcache-data-7
            - mountPath: /data-8
              name: xcache-data-8
            - mountPath: /data-9
              name: xcache-data-9
            - mountPath: /data-10
              name: xcache-data-10
            - mountPath: /data-11
              name: xcache-data-11
            - mountPath: /data-12
              name: xcache-data-12
            - mountPath: /data-13
              name: xcache-data-13
            - mountPath: /data-14
              name: xcache-data-14
            - mountPath: /data-15
              name: xcache-data-15
            - mountPath: /data-16
              name: xcache-data-16
            - mountPath: /data-17
              name: xcache-data-17
            - mountPath: /data-19
              name: xcache-data-19
            - mountPath: /data-20
              name: xcache-data-20
            - mountPath: /data-21
              name: xcache-data-21
            - mountPath: /data-22
              name: xcache-data-22
            - mountPath: /data-23
              name: xcache-data-23
            - mountPath: /data-24
              name: xcache-data-24
            - name: x509-data
              mountPath: /etc/proxy
              readOnly: true
            - name: grid-security
              mountPath: /etc/grid-security
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # Rucio heartbeat, as on the native XCaches: every FREQUENCY seconds it
        # asks ixcache for its site name (xrdfs query config sitename) and, if it
        # matches XC_RESOURCENAME, posts a heartbeat to Rucio as the xcache account
        # (token from the shared proxy). size is the df total of /xcache/data_*.
        # Runs as root: rucio writes its token under /opt/rucio/etc.
        - name: heartbeats
          image: harbor.tempest.uchicago.edu/docker.io/ivukotic/atlas-xcache-heartbeats:2026.10.18
          imagePullPolicy: Always
          command:
            - /usr/local/sbin/run_heartbeats.sh
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: XC_RESOURCENAME
              value: MWT2
            - name: XC_INSTANCE
              value: xcache-uc-1
            - name: ADDRESS
              value: $(HOST_IP):1094
            - name: FREQUENCY
              value: "60"
          resources:
            limits:
              cpu: 500m
              memory: 512M
            requests:
              cpu: 500m
              memory: 512M
              ephemeral-storage: 600Mi
          volumeMounts:
            - mountPath: /etc/proxy/
              name: x509-data
              readOnly: true
            - mountPath: /etc/grid-certs/
              name: x509-certs-volume
              readOnly: true
            - mountPath: /xcache/data_1
              name: xcache-data-1
              readOnly: true
            - mountPath: /xcache/data_2
              name: xcache-data-2
              readOnly: true
            - mountPath: /xcache/data_3
              name: xcache-data-3
              readOnly: true
            - mountPath: /xcache/data_4
              name: xcache-data-4
              readOnly: true
            - mountPath: /xcache/data_5
              name: xcache-data-5
              readOnly: true
            - mountPath: /xcache/data_6
              name: xcache-data-6
              readOnly: true
            - mountPath: /xcache/data_7
              name: xcache-data-7
              readOnly: true
            - mountPath: /xcache/data_8
              name: xcache-data-8
              readOnly: true
            - mountPath: /xcache/data_9
              name: xcache-data-9
              readOnly: true
            - mountPath: /xcache/data_10
              name: xcache-data-10
              readOnly: true
            - mountPath: /xcache/data_11
              name: xcache-data-11
              readOnly: true
            - mountPath: /xcache/data_12
              name: xcache-data-12
              readOnly: true
            - mountPath: /xcache/data_13
              name: xcache-data-13
              readOnly: true
            - mountPath: /xcache/data_14
              name: xcache-data-14
              readOnly: true
            - mountPath: /xcache/data_15
              name: xcache-data-15
              readOnly: true
            - mountPath: /xcache/data_16
              name: xcache-data-16
              readOnly: true
            - mountPath: /xcache/data_17
              name: xcache-data-17
              readOnly: true
            - mountPath: /xcache/data_19
              name: xcache-data-19
              readOnly: true
            - mountPath: /xcache/data_20
              name: xcache-data-20
              readOnly: true
            - mountPath: /xcache/data_21
              name: xcache-data-21
              readOnly: true
            - mountPath: /xcache/data_22
              name: xcache-data-22
              readOnly: true
            - mountPath: /xcache/data_23
              name: xcache-data-23
              readOnly: true
            - mountPath: /xcache/data_24
              name: xcache-data-24
              readOnly: true
      volumes:
        # CA certificates and CRLs, filled and refreshed by the x509 sidecar.
        - name: grid-security
          emptyDir:
            sizeLimit: 200Mi
        - name: tmp
          emptyDir: {}

        - name: x509-data
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: x509-certs-volume
          secret:
            defaultMode: 420
            items:
              - key: userkey
                mode: 256
                path: userkey.pem
              - key: usercert
                path: usercert.pem
            secretName: xcache-cert-secret
        - hostPath:
            path: /xcache/1
          name: xcache-data-1
        - hostPath:
            path: /xcache/2
          name: xcache-data-2
        - hostPath:
            path: /xcache/3
          name: xcache-data-3
        - hostPath:
            path: /xcache/4
          name: xcache-data-4
        - hostPath:
            path: /xcache/5
          name: xcache-data-5
        - hostPath:
            path: /xcache/6
          name: xcache-data-6
        - hostPath:
            path: /xcache/7
          name: xcache-data-7
        - hostPath:
            path: /xcache/8
          name: xcache-data-8
        - hostPath:
            path: /xcache/9
          name: xcache-data-9
        - hostPath:
            path: /xcache/10
          name: xcache-data-10
        - hostPath:
            path: /xcache/11
          name: xcache-data-11
        - hostPath:
            path: /xcache/12
          name: xcache-data-12
        - hostPath:
            path: /xcache/13
          name: xcache-data-13
        - hostPath:
            path: /xcache/14
          name: xcache-data-14
        - hostPath:
            path: /xcache/15
          name: xcache-data-15
        - hostPath:
            path: /xcache/16
          name: xcache-data-16
        - hostPath:
            path: /xcache/17
          name: xcache-data-17
        - hostPath:
            path: /xcache/19
          name: xcache-data-19
        - hostPath:
            path: /xcache/20
          name: xcache-data-20
        - hostPath:
            path: /xcache/21
          name: xcache-data-21
        - hostPath:
            path: /xcache/22
          name: xcache-data-22
        - hostPath:
            path: /xcache/23
          name: xcache-data-23
        - hostPath:
            path: /xcache/24
          name: xcache-data-24
